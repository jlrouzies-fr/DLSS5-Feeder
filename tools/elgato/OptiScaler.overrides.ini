; Keys Deploy-ElgatoStudio.ps1 forces into OptiScaler.ini on every deploy, on top of either the
; saved live copy or the fork's stock OptiScaler.ini. Each one was needed on Elgato Studio
; (WinUI 3, composition swap chain) -- see docs/STATUS-ELGATO-STUDIO.md. A fresh fork INI
; without them crashes the app (0xC000027B / 0xC0000374) or breaks ReShade's input.
; Needs the jlrouzies-fr fork, branch fix/finished-picture-reshade (cff47ae4 or later):
; InputHooks and WrapCompositionSwapChain do not exist upstream.

[FrameGen]
; the wrapper handed to WinUI's SwapChainPanel corrupts the heap
WrapCompositionSwapChain=false

[Menu]
; OptiScaler cannot hook CreateSwapChainForComposition: draw the menu inside the upscaler output
OverlayMenu=false
; passive input: no GetCursorPos/GetAsyncKeyState/WndProc detours (they broke ReShade's polled
; cursor and made its toggle key repeat); the menu polls keys + cursor, wheel via WH_MOUSE_LL
InputHooks=false

[Spoofing]
Dxgi=false
StreamlineSpoofing=false

[Inputs]
EnableXeSSInputs=false
EnableFsr2Inputs=false
EnableFsr3Inputs=false
EnableFfxInputs=false

[Upscalers]
Dx12Upscaler=dlss

[DlssNr]
Enabled=true
FinishedPicture=false

[Hotfix]
CheckForUpdate=false

[Log]
LogToFile=true
LogLevel=2
LogAsync=false

; Elgato Studio defaults for dlss5-feed.cfg, where they differ from the add-on's own.
; Deploy-ElgatoStudio.ps1 applies each line ONCE per value (it keeps a note of what it has
; applied in <store>\saved\dlss5-feed.defaults-applied.txt), so whatever you choose in the
; add-on's overlay afterwards survives the next deploy. Change a value here and it is applied
; once more.

; DLSS render preset L. Chosen by eye on the real thing (PS5 menus, 4K HDR10, the neural pass
; behind it, 2026-11-12): with E, white text and other plain bright areas came out of the neural
; pass speckled -- single pixels well above anything in the picture that went in -- and with L
; or M they are clean.
; tools/fx-testbed does not show this, and says the opposite of plain DLAA WITHOUT a neural
; pass: there E leaves text closest to what went in (HUD error 0.33 against 0.96 for L, static
; 14 px text 0.99 of its edge energy against 0.77), which is why E used to be the default here.
; "Closest to the input" is not the measure once a neural pass redraws the picture.
preset=12

; Elgato Studio defaults for dlss5-feed.cfg, where they differ from the add-on's own.
; Deploy-ElgatoStudio.ps1 applies each line ONCE per value (it keeps a note of what it has
; applied in <store>\saved\dlss5-feed.defaults-applied.txt), so whatever you choose in the
; add-on's overlay afterwards survives the next deploy. Change a value here and it is applied
; once more.

; DLSS render preset E. A capture is text, HUD and 2D over video, and E is the preset that
; leaves that closest to what went in: tools/fx-testbed, 4K DLAA, static 14 px text keeps 0.99
; of its edge energy against 0.84 on the default (K), a still caption is off by 0.05 8-bit steps
; against 1.2, and with the neural pass behind it the HUD error is the lowest of E/K/L/M.
; (E is a legacy model that NVIDIA no longer documents: measured with nvngx_dlss.dll 310.8, and
; what a later DLL does with the number is up to NVIDIA.)
preset=5
